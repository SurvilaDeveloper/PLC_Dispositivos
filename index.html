<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <script>
    (() => {
      const redirect = new URLSearchParams(window.location.search).get('redirect');
      const basePath = '%BASE_URL%';

      if (!redirect) {
        return;
      }

      const target = new URL(redirect, window.location.origin);

      if (
        target.origin === window.location.origin &&
        target.pathname.startsWith(basePath)
      ) {
        window.history.replaceState(
          null,
          '',
          `${target.pathname}${target.search}${target.hash}`,
        );
      }
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Toolkit técnico interactivo de electricidad, electrónica y automatización con apuntes, calculadoras, PLC, motores, instalaciones y sistemas embebidos."
  />
  <meta name="author" content="Gabriel E. Survila" />
  <meta name="theme-color" content="#020617" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Electricidad, Electrónica y Automatización" />
  <meta
    property="og:description"
    content="Apuntes, calculadoras y herramientas técnicas sobre electricidad, electrónica, PLC, automatización y sistemas embebidos."
  />

  <title>Electricidad, Electrónica y Automatización | Toolkit técnico</title>
</head>

</body>

</html>
